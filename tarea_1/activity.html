<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Report Activity</title>
  </head>
  <body>
  	<div id="userStatus" style="position:absolute; top:10px; right:10px; text-align:right;"></div>
    <nav><a href="index.html">Home</a></nav>
    <h2>Report Activity</h2>
    <div id="activityMessage" style="display:none;">
      <p>You can not add activities if you are not registered</p>
    </div>
    <div id="activityForm">
      <form onsubmit="return validateActivity()">
        <p>Owner of activity: <strong id="activeUserName"></strong></p>
        <h3>Name of activity: *</h3>
          <input id="activityName" placeholder="Activity Name *">
        <h3>Category: *</h3>
        <select>
          <option>Artistic</option>
          <option>Athletic</option>
          <option>Tech</option>
          <option>Social</option>
          <option>Recreational</option>
        </select>
        <h3>Schedule: *</h3>
          <div class="schedule-row">
            <div class="field">
              <label for="day">Day</label>
              <select id="day"></select>
            </div>

            <div class="field">
              <label for="hour">Hour</label>
              <select id="hour"></select>
            </div>

            <div class="field">
              <label for="minute">Minute</label>
              <select id="minute"></select>
            </div>

            <div class="field">
              <label for="duration">Duration</label>
              <input id="duration" type="number" placeholder="min (max 240)">
            </div>

            <button type="button" onclick="addSchedule()">Add</button>
          </div>
        <ul id="scheduleList"></ul>
        <h3>Image or video about activity: *</h3>
          <div id="fileContainer">
            <input type="file" accept="image/*,video/*" onchange="handleSingleFile(this)">
          </div>
          <div id="fileInfo">0 / 8 files selected</div>
        <h3>Link of activity: *</h3>
          <input id="link" placeholder="Related Link *">
        <button type="submit">Submit</button>
      </form>
    </div>
    <script>

    window.onload = function(){
      const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
      const daySelect = document.getElementById("day");
      days.forEach(d=> daySelect.innerHTML += `<option>${d}</option>`);

      const hour = document.getElementById("hour");
      for(let i=0;i<24;i++) hour.innerHTML += `<option>${String(i).padStart(2,'0')}</option>`;

      const minute = document.getElementById("minute");
      for(let i=0;i<60;i++) minute.innerHTML += `<option>${String(i).padStart(2,'0')}</option>`;
    }
    </script>

  </body>
</html>
