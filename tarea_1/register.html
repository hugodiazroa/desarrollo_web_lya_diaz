<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
  </head>
  <body>
    <nav><a href="index.html">Home</a></nav>
    <h2>Register Member</h2>
    <form onsubmit="return validateRegister()">
      <input id="name" placeholder="Name *">
      <input id="email" placeholder="Email *">
      <input placeholder="Phone *">
      <select id="type" onchange="updateExtra()">
        <option value="">Select Type *</option>
        <option value="student_undergrad">Undergrad</option>
        <option value="student_grad">Graduate</option>
        <option value="staff">Staff</option>
        <option value="faculty">Faculty</option>
      </select>
      <label id="extraLabel">Program/Department *</label>
      <input id="extra">
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
