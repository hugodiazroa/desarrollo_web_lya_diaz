<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    <title>Home - Scheduler</title>
  </head>
  <body>
  	<div id="userStatus" style="position:absolute; top:10px; right:10px; text-align:right;"></div>
    <nav>
      <a href="{{ url_for('register') }}">Register</a>
      <a href="{{ url_for('activity') }}">Activity</a>
      <a href="{{ url_for('members') }}">Members</a>
      <a href="{{ url_for('metrics') }}">Metrics</a>
    </nav>
    <h1>Scheduler</h1>
    {% if message %}
      <div class="success-message" style="padding:0.75rem 1rem; border:1px solid #0a0; background:#e8f7e8; color:#060; margin-top:1rem; border-radius:4px;">
        {{ message }}
      </div>
    {% endif %}
  </body>
</html>
