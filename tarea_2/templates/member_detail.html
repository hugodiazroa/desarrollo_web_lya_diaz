<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    <title>Member Details</title>
    <style>
      .member-info {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #0f0f0f;
        border-radius: 5px;
        background-color: #000000;
      }

      .member-info h2 {
        margin-top: 0;
        margin-bottom: 10px; 
      }

      .info-row {
        margin: 10px 0;
      }
      .info-label {
        font-weight: bold;
        min-width: 150px;
        display: inline-block;
      }
      .activities-section {
        margin-top: 5px;
      }
      .activity-card {
        border: 1px solid #0f0f0f;
        padding: 15px;
        margin: 15px 0;
        border-radius: 5px;
        background-color: #000000;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .activity-text {
        flex: 1;
      }
      .activity-image {
        margin-left: 20px;
      }
      .activity-image img {
        height: 5em;
        width: auto;
        cursor: pointer;
      }
      .activity-title {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .activity-detail {
        margin: 5px 0;
      }
      .description-text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .no-activities {
        font-style: italic;
        color: #666;
        padding: 15px;
      }
      #loading {
        text-align: center;
        padding: 20px;
        font-size: 1.1em;
      }
      .error {
        color: #d32f2f;
        padding: 15px;
        border: 1px solid #d32f2f;
        border-radius: 5px;
        background-color: #ffebee;
      }
    </style>
  </head>
  <body>
    <div id="userStatus" style="position:absolute; top:10px; right:10px; text-align:right;"></div>
    <nav><a href="{{ url_for('index') }}">Home</a> | <a href="{{ url_for('members') }}">Back to Members</a></nav>

    <div id="loading">Loading member details...</div>
    <div id="content" style="display:none;">
      <div class="member-info">
        <h2 id="memberName"></h2>
        <div class="info-row">
          <span class="info-label">Email:</span>
          <span id="memberEmail"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Phone:</span>
          <span id="memberPhone"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Type:</span>
          <span id="memberType"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Comuna:</span>
          <span id="memberComuna"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Registration Date:</span>
          <span id="memberRegDate"></span>
        </div>
      </div>

      <div class="activities-section">
        <h3>Activities</h3>
        <div id="activitiesContainer"></div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const memberId = {{ member_id }};
        loadMemberDetail(memberId);
      });

      function loadMemberDetail(memberId) {
        fetch(`/api/member/${memberId}`)
          .then(response => {
            if (!response.ok) {
              throw new Error('Member not found');
            }
            return response.json();
          })
          .then(data => displayMemberDetail(data))
          .catch(error => {
            document.getElementById('loading').innerHTML = `<div class="error">Error: ${error.message}</div>`;
          });
      }

      function wrapDescription(text, maxLength) {
        let result = '';
        for (let i = 0; i < text.length; i += maxLength) {
          result += text.slice(i, i + maxLength) + '<br>';
        }
        return result;
      }

      function displayMemberDetail(member) {
        document.getElementById('memberName').textContent = member.name;
        document.getElementById('memberEmail').textContent = member.email;
        document.getElementById('memberPhone').textContent = member.phone;
        document.getElementById('memberType').textContent = member.type;
        document.getElementById('memberComuna').textContent = member.comuna;
        
        const regDate = new Date(member.registration_date);
        document.getElementById('memberRegDate').textContent = regDate.toLocaleDateString();

        const activitiesContainer = document.getElementById('activitiesContainer');
        if (member.activities && member.activities.length > 0) {
          activitiesContainer.innerHTML = member.activities.map(activity => `
            <div class="activity-card">
              <div class="activity-text">
                <div class="activity-title">${activity.name}</div>
                <div class="activity-detail">
                  <span class="info-label">Category:</span> ${activity.category}
                </div>
                <div class="activity-detail">
                  <span class="info-label">Day:</span> ${activity.day}
                </div>
                <div class="activity-detail">
                  <span class="info-label">Start Time:</span> ${activity.start_time}
                </div>
                <div class="activity-detail">
                  <span class="info-label">Duration:</span> ${activity.duration} minutes
                </div>
                ${activity.description ? `<div class="activity-detail"><span class="info-label">Description:</span><br><div class="description-text">${wrapDescription(activity.description, 40)}</div></div>` : ''}
              </div>
              ${activity.images && activity.images.length > 0 ? `<div class="activity-image">
                ${activity.images.map(img => `<img src="${img}" alt="${activity.name}" onclick="window.open(this.src, '_blank')">`).join('')}
              </div>` : ''}
            </div>
          `).join('');
        } else {
          activitiesContainer.innerHTML = '<div class="no-activities">No activities registered</div>';
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      }
    </script>
  </body>
</html>
